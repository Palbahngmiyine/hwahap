name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Require this tested commit to still be main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.sha }}
        run: test "$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)" = "$TESTED_SHA"
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
  # Validate the release branch explicitly in this same workflow instead.
  release-pr-ci:
    needs: release
    if: needs.release.outputs.pr != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ fromJSON(needs.release.outputs.pr).headBranchName }}

  packages:
    needs: release
    if: needs.release.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Build and smoke-test the installable package
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
          test "$RELEASE_TAG" = "v$(cat version.txt)"
          cargo build --locked --release --manifest-path runtime/Cargo.toml --target "$TARGET"
          tests/package.sh "$TARGET"
      - name: Upload package and checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --clobber
