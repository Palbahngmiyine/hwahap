name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  packages:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Build and smoke-test the versioned plugin package
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat plugins/hwahap/version.txt)"
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
          cargo build --locked --release --manifest-path plugins/hwahap/runtime/Cargo.toml --target "$TARGET"
          tests/package.sh "$TARGET"
      - name: Verify actual Codex plugin installation
        env:
          TARGET: ${{ matrix.target }}
        run: |
          npm install --prefix "$RUNNER_TEMP/hwahap-codex" @openai/codex@0.152.1 --ignore-scripts --no-audit --no-fund
          export PATH="$RUNNER_TEMP/hwahap-codex/node_modules/.bin:$PATH"
          python3 tests/plugin-install.py "plugins/hwahap/runtime/target/$TARGET/release/hwahap"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish only after every platform has passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-draft.txt; then
            if [ "$(cat release-draft.txt)" != true ]; then
              echo "Release $RELEASE_TAG is already published; keeping assets immutable."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --draft --title "Hwahap $RELEASE_TAG"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
