name: Hwahap

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hwahap-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deliberately no global `RUSTFLAGS: -D warnings`: it applies to dependencies too, so a warning
  # in an upstream crate would fail this build for something nobody here can fix. The Lint step
  # passes `-D warnings` to clippy instead, which covers rustc's lints for this crate as well.

jobs:
  # Windows runs the unit tests only: the cycle harness and the engine's test runner both need a
  # POSIX shell, so `tests/cycle.rs` is `#![cfg(unix)]`. See PLATFORM.md §4.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Identify git for the integration tests
        run: |
          git config --global user.email "hwahap@example.invalid"
          git config --global user.name "Hwahap CI"
          git config --global init.defaultBranch main

      - name: Check formatting
        run: cargo fmt --manifest-path plugins/hwahap/runtime/Cargo.toml --all -- --check

      - name: Lint
        run: cargo clippy --locked --manifest-path plugins/hwahap/runtime/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --manifest-path plugins/hwahap/runtime/Cargo.toml --all-targets

      - name: Verify runtime download recovery
        if: runner.os != 'Windows'
        run: tests/download.sh

      - name: Reject generated repository changes
        run: test -z "$(git status --porcelain --untracked-files=all)"

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Enforce the static simplicity gates
        run: tests/gates.sh

      - name: Check the launcher and the skill manifest
        run: |
          sh -n plugins/hwahap/bin/hwahap
          test -x plugins/hwahap/bin/hwahap
          test -f plugins/hwahap/skills/hwahap/SKILL.md
          test -f plugins/hwahap/.codex-plugin/plugin.json
          head -1 plugins/hwahap/skills/hwahap/SKILL.md | grep -qx -- ---
          grep -qE '^name: hwahap$' plugins/hwahap/skills/hwahap/SKILL.md
          grep -qE '^description: ' plugins/hwahap/skills/hwahap/SKILL.md

  verify:
    needs: [test, gates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          GATES_RESULT: ${{ needs.gates.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$GATES_RESULT" = success
