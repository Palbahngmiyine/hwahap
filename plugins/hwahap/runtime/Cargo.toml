[package]
name = "hwahap"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hex = "0.4.3"
rmcp = { version = "3.2.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs", "signal"] }
toml = "1.1.5"

# Only for `killpg`, so a timed-out test command cannot outlive the attempt that ran it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
